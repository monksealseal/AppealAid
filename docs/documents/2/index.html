<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AppealAid - Document View</title>
  <script>
    // This file is specifically for /documents/{id} routes
    
    // Extract document ID from URL
    const pathParts = window.location.pathname.split('/');
    const documentId = pathParts[pathParts.length - 1];
    
    // Validate document ID
    if (documentId && documentId !== '') {
      // Store the exact path for React Router
      sessionStorage.setItem('redirectPath', `/documents/${documentId}`);
      console.log(`Direct document access: ${documentId}. Stored path: /documents/${documentId}`);
    }
    
    // Add any query parameters
    if (window.location.search) {
      const redirectPath = sessionStorage.getItem('redirectPath');
      sessionStorage.setItem('redirectPath', `${redirectPath}${window.location.search}`);
    }
    
    // Redirect to main app
    window.location.href = '/AppealAid/';
  </script>
</head>
<body>
  <p>Redirecting to document view...</p>
</body>
</html>
